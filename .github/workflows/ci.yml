name: CI
on:
  push:
  pull_request:

permissions:
  contents: read          # least privilege for every job

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest        # tests pass their own throwaway secrets and mock Google

  secrets-smoke-test:
    # Shows how the pipeline injects a secret: only on main, only from the
    # "production" environment, as an env var; GitHub masks it in the logs.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Start the app with the production secrets
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python -c "from app import create_app; app = create_app(); \
          assert len(app.config['SECRET_KEY']) >= 32, 'SECRET_KEY too short'; \
          assert app.config['GOOGLE_CLIENT_ID'].endswith('.apps.googleusercontent.com'), 'GOOGLE_CLIENT_ID malformed'; \
          assert app.config['SESSION_COOKIE_SECURE'], 'session cookie must be Secure in production'; \
          print('Secrets injected from GitHub Secrets, checks OK (values never printed)')"
