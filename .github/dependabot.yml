version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # keep the GitHub Actions used by CI up to date (they are pinned to commit SHAs)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
